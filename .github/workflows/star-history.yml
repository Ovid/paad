name: star-history
on:
  schedule: [{cron: "17 3 * * *"}]
  push: {branches: ['**'], paths: ['.github/workflows/star-history.yml']}
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: star-history}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 star_history.py update
        env: {GITHUB_TOKEN: "${{ github.token }}"}
      - run: |
          git symbolic-ref -q HEAD >/dev/null || { echo "detached HEAD, nothing to push"; exit 0; }
          git add -A .github/star-history
          git diff --cached --quiet && exit 0
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update star history"
          git push
